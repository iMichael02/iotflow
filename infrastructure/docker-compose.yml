services:
    mqtt:
        image: eclipse-mosquitto:2
        container_name: iotflow-mqtt
        ports:
            - "1883:1883"
            - "9001:9001"
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
            - mosquitto_data:/mosquitto/data
            - mosquitto_log:/mosquitto/log
        networks:
            - iotflow-network

    kafka:
        image: bitnami/kafka:3.7
        container_name: iotflow-kafka
        ports:
            - "9092:9092"
        environment:
            - KAFKA_CFG_NODE_ID=1
            - KAFKA_CFG_PROCESS_ROLES=controller,broker
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
            - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
        networks:
            - iotflow-network

    minio:
        image: minio/minio
        container_name: iotflow-minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadminpassword
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        networks:
            - iotflow-network

    postgres:
        image: postgres:18
        container_name: iotflow-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: iotflow
            POSTGRES_PASSWORD: iotflow_password
            POSTGRES_DB: iotflow
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U iotflow -d iotflow"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - iotflow-network

volumes:
    mosquitto_data:
    mosquitto_log:
    postgres_data:
    minio_data:
    kafka_data:

networks:
    iotflow-network:
        driver: bridge
